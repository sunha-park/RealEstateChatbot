<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='index1Style.css') }}">
    <link href="https://cdn.jsdelivr.net/gh/GoogleFonts/pretendard@main/variable/pretendard-variable.css" rel="stylesheet">     
    <title>부동산 매물 지도 검색</title>
</head>
<body>
    <div class="container">
    <header>
        <a href="{{ url_for('chat') }}" class="chat-link">
            <div class="chat-container">
                <img src="{{ url_for('static', filename='headset-icon.png') }}" alt="headset icon" class="chat-icon">
            </div>
        </a>
        <h4>부동산 매물 현황</h4>
        <form action="/search" method="get" id="filterForm">
            <!-- 검색창과 검색 버튼을 나란히 배치 -->
            <div class="search-bar">
                <input type="text" name="keyword" placeholder="매물명 혹은 도로명 입력" value="{{ keyword | default('') }}" class="search-input">
                <input type="submit" value="검색" class="search-button">
            </div>

            <!-- 필터 옵션: 층수, 면적, 최소 금액, 최대 금액 -->
            <div class="filter-options">
                <!-- 층수 필터 -->
                <select name="floor" class="filter-select">
                    <option value="">층수</option>
                    <option value="지상층">지상층</option>
                    <option value="반지하">반지하</option>
                    <option value="옥탑">옥탑</option>
                </select>

                <!-- 전용 면적 필터 -->
                <select name="area" class="filter-select">
                    <option value="">면적</option>
                    <option value="10평 이하">10평 이하</option>
                    <option value="10평대">10평대</option>
                    <option value="20평대">20평대</option>
                    <option value="30평대">30평대</option>
                    <option value="40평대">40평대</option>
                    <option value="50평대">50평대</option>
                    <option value="60평 이상">60평 이상</option>
                </select>

            </div>
        </form>
    </header>
        
        <main>
            <div class="map-container">
                <!-- 지도 파일을 iframe으로 로드합니다. -->
                <iframe src="{{ url_for('static', filename=map_file) }}" width="100%" height="600px" frameborder="0"></iframe>
            </div>
        </main>
    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="bottom-nav">
        <a href="/memo">
            <div class="nav-icon"><img src="{{ url_for('static', filename='notes.png') }}" alt="메모장"></div>
            <span>메모장</span>
        </a>
        <a href="/" class="active">
            <div class="nav-icon"><img src="{{ url_for('static', filename='home.png') }}" alt="홈"></div>
            <span>홈</span>
        </a>
        <a href="/analysis">
            <div class="nav-icon"><img src="{{ url_for('static', filename='analysis.png') }}" alt="분석하기"></div>
            <span>분석하기</span>
        </a>
    </nav>

    <script>
        // 폼 요소 가져오기
        const filterForm = document.getElementById('filterForm');

        // 폼 자동 제출 함수
        function applyFilter() {
            filterForm.submit();
        }

        // 필터링 조건 변경 시 자동으로 폼 제출
        document.querySelectorAll('.filter-select, .price-input').forEach(element => {
            element.addEventListener('change', applyFilter);
        });
    </script>

</body>
</html>
