<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모장</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='analysis.css') }}">
</head>
<body>
<div class="container">
    <a href="{{ url_for('chat') }}" class="chat-link">
        <div class="chat-container">
            <img src="{{ url_for('static', filename='headset-icon.png') }}" alt="headset icon" class="chat-icon">
        </div>
    </a>
    
    <h3>메모장</h3>
    <div class="notes">
            {% for note in notes %}
            <div class="note" data-task-date="{{ note.task_date }}" data-task-content="{{ note.task_content }}" data-memo-content="{{ note.memo_content }}">
                <div class="note-content">
                    <div class="note-date">{{ note.task_date }}</div>
                    <div class="note-task">{{ note.task_content }}</div>
                    <div class="note-memo">{{ note.memo_content }}</div>
                    
                    <!-- 버튼 컨테이너: 마우스를 올리면 표시 -->
                    <div class="note-buttons">
                        <button onclick="deleteNote('{{ note.task_date }}', '{{ note.task_content }}', '{{ note.memo_content }}')">삭제하기</button>
                        <a href="{{ url_for('note_detail') }}?task_date={{ note.task_date }}&task_content={{ note.task_content }}&memo_content={{ note.memo_content }}" class="analyze-button">분석하기</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
        <!-- 하단 네비게이션 바 -->
        <nav class="bottom-nav">
            <a href="/memo">
                <div class="nav-icon"><img src="{{ url_for('static', filename='notes.png') }}" alt="메모장"></div>
                <span>메모장</span>
            </a>
            <a href="/" class="active">
                <div class="nav-icon"><img src="{{ url_for('static', filename='home.png') }}" alt="홈"></div>
                <span>홈</span>
            </a>
            <a href="/analysis">
                <div class="nav-icon"><img src="{{ url_for('static', filename='analysis.png') }}" alt="분석하기"></div>
                <span>분석하기</span>
            </a>
        </nav>
    </div>
    <script>
        function deleteNote(task_date, task_content, memo_content) {
            fetch(`/delete_note?task_date=${encodeURIComponent(task_date)}&task_content=${encodeURIComponent(task_content)}&memo_content=${encodeURIComponent(memo_content)}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    // task_date, task_content, memo_content 값에 맞는 노트를 찾고 삭제
                    const noteElement = document.querySelector(`[data-task-date='${task_date}'][data-task-content='${task_content}'][data-memo-content='${memo_content}']`);
                    if (noteElement) {
                        noteElement.remove();
                    }
                } else {
                    alert("메모 삭제에 실패했습니다.");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("오류가 발생했습니다.");
            });
        }
    </script>

</body>
</html>
